name: typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      # The open-source export intentionally has no pnpm-lock.yaml: the main
      # repository lockfile references closed packages. Install resolves the
      # ranges in package.json. Do not switch this to --frozen-lockfile unless
      # a lockfile is generated for the open-source workspace.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @lions/mind prebuild
          pnpm --filter @lions/session prebuild
          pnpm --filter @lions/selfimproving prebuild

      - name: Build workspace libraries
        # Apps resolve @lions/* through dist (webpack alias), so libraries must be built
        # before typecheck. Do not build the 5 apps here: next build needs a live DB.
        run: pnpm --filter "./packages/core/**" --filter "./packages/modules/**" --filter "./packages/configs/**" --filter "./packages/ui/**" -r build

      - name: Typecheck apps
        run: |
          pnpm --filter @lions/mind typecheck
          pnpm --filter @lions/session typecheck
          pnpm --filter @lions/console typecheck
          pnpm --filter @lions/selfimproving exec tsc --noEmit
          pnpm --filter @lions/portal exec tsc --noEmit
